# Run from the project root: python -m TrainWorks.scripts.train
# All relative paths below resolve from the project root, not this YAML file
# or the current working directory. Absolute paths are also supported.

experiment_name: "neurodynEEG"

data:
  chunk_dir: "TrainData/NeuroDynV1"
  file_glob: "chunk_*_Param14.npz"
  amp_filter_lo: 3.0
  amp_filter_hi: 100.0
  val_chunks: 10
  normalise: "zscore"

model:
  kind: "v6"
  in_nodes: 19
  T: 1280
  hidden_scalp: 128
  pinv_hidden_per_node: 12
  pinv_out_per_node: 24
  pinv_ridge: 1.0e-3
  source_nodes: 90
  spec_freq_bins: 201
  spec_hidden: 32
  d_spec: 64
  d_model: 192
  n_heads: 6
  n_self_attn: 2
  n_cross_attn: 2
  ff_dim: 384
  dropout: 0.1
  time_pool: 8
  node_emb_dim: 32
  head_hidden: 128
  # per-param alpha; key "__default__" is the fallback for any param not listed.
  bound_alpha:
    __default__: 0.3
    tau_e1: 0.5
    theta: 0.3
    rmax: 0.3
    beta: 0.3
    tau_e2: 0.3
    C1: 0.15                     
    C2: 0.15
    C3: 0.10                     
    C4: 0.10
    delay_scale: 0.10            

train:
  n_epoch: 50
  batch_size: 500
  lr: 1.0e-3
  weight_decay: 1.0e-5
  device: "cuda:0"

  use_bounds_mask: true
  loss_kind: "huber"
  loss_beta: 0.1
  loss_normalise: "none"

  lr_schedule: "none"
  warmup_steps: 0
  grad_clip: 1.0
  reset_optimizer: true

loss_weights:
  tau_e1: 2.0
  tau_i1: 2.0
  theta: 2.0
  rmax: 2.0
  beta: 2.0
  tau_e2: 2.0
  tau_i2: 2.0
  C1: 2.0
  C2: 2.0
  C3: 1.0                       
  C4: 1.0
  delay_scale: 0.3              
logging:
  log_every: 50
  ckpt_dir: "TrainWorks/checkpoints"
  log_dir: "TrainWorks/logs"
